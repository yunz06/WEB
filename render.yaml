services:
  - type: web
    name: news-hub
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health.php
    disk:
      name: news-hub-article-uploads
      mountPath: /var/www/html/public/uploads/articles
      sizeGB: 1
    envVars:
      - key: NEWS_HUB_DB_HOST
        sync: false
      - key: NEWS_HUB_DB_PORT
        value: "3306"
      - key: NEWS_HUB_DB_NAME
        sync: false
      - key: NEWS_HUB_DB_USER
        sync: false
      - key: NEWS_HUB_DB_PASS
        sync: false
      - key: NEWS_HUB_DB_CHARSET
        value: utf8mb4
