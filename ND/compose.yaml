# Local demonstration only: Docker daemon + internet to pull images are needed.
# Bind dashboard port only to 127.0.0.1. Do NOT deploy this compose file publicly.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: news_hub_demo
      MYSQL_USER: dashboard_demo
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:?Copy .env.example to .env and set DEMO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DEMO_ROOT_PASSWORD:?Copy .env.example to .env and set DEMO_ROOT_PASSWORD}
    volumes:
      - demo_mysql_data:/var/lib/mysql
      - ./database/demo_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/demo_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s
    networks: [demo_private]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DASHBOARD_STANDALONE_DEMO: 'true'
      DEMO_ADMIN_USER: ${DEMO_ADMIN_USER:?Set DEMO_ADMIN_USER}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD}
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: news_hub_demo
      DB_USER: dashboard_demo
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
      TEST_DB_DSN: mysql:host=db;port=3306;dbname=news_hub_demo;charset=utf8mb4
      TEST_USE_DEMO_SCHEMA: 'true'
      TEST_DB_USER: dashboard_demo
      TEST_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./:/var/www/html:ro
    networks: [demo_private]

volumes:
  demo_mysql_data:
networks:
  demo_private:
